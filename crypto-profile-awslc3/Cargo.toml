[package]
name = "crypto-profile-awslc3"
description = "The crypto-profile backend on the AWS-LC FIPS 3.x module, through aws-lc-rs 1.17"
version = "0.10.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crypto-profile/crypto-profile"
readme = "../README.md"
keywords = ["fips", "tls", "rustls", "cryptography", "aws-lc"]
categories = ["cryptography", "network-programming"]
exclude = [".cargo/"]
build = "build.rs"
links = "crypto-profile-backend"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
test-support = []

[dependencies]
crypto-profile = { path = "../crypto-profile", version = "=0.10.0" }
# Prevent resolution onto the 4.x module.
aws-lc-rs = { version = "=1.17.4", features = ["fips", "ring-io"] }
# Pin the FIPS module source: aws-lc-rs requires it by caret, and build.rs refuses any release but
# 0.13.17, so without this pin a fresh resolution would take a later 0.13.x and the build would fail.
aws-lc-fips-sys = { version = "=0.13.17", default-features = false }
# Pin the policy/provider API so resolution cannot change its contract.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
# Later rcgen requires aws-lc-rs 1.18, crossing the selected FIPS module line.
rcgen = { version = "=0.14.9", default-features = false, features = ["aws_lc_rs", "fips", "pem"] }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std"] }
# Pin the rest of the shipped graph to the versions this release was tested with (decision 0017).
pem = "=4.0.0"
zeroize = "=1.9.1"

[dev-dependencies]
hex = "0.4"
crypto-profile = { path = "../crypto-profile", version = "=0.10.0", features = ["conformance"] }
x509-parser = { version = "0.18", default-features = false }
# Pin the policy/provider API so resolution cannot change its contract.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
# Pin verifier identifiers used by the shared CSR tests.
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std"] }

[[test]]
name = "conformance"
required-features = ["test-support"]

[[test]]
name = "openssl_interop"
required-features = ["test-support"]
