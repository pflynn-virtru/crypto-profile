[package]
name = "crypto-profile-awslc3"
description = "The crypto-profile backend on the AWS-LC FIPS 3.x module, through aws-lc-rs 1.17"
version = "0.10.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crypto-profile/crypto-profile"
readme = "../README.md"
keywords = ["fips", "tls", "rustls", "cryptography", "aws-lc"]
categories = ["cryptography", "network-programming"]
exclude = [".cargo/"]
build = "build.rs"
links = "crypto-profile-backend"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
test-support = []

[dependencies]
crypto-profile = { path = "../crypto-profile", version = "=0.10.0" }
# Prevent resolution onto the 4.x module; Cargo.lock pins the 3.x sys source to 0.13.17.
aws-lc-rs = { version = "=1.17.4", default-features = false, features = ["fips", "alloc", "ring-io", "ring-sig-verify"] }
# Pin the policy/provider API so resolution cannot change its contract.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
# CSR encoding only: rcgen does no cryptography here, so it brings in no aws-lc-rs.
rcgen = { version = "=0.15.0", default-features = false, features = ["pem"] }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std"] }
pem = "4"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
crypto-profile = { path = "../crypto-profile", version = "=0.10.0", features = ["conformance"] }
x509-parser = { version = "0.18", default-features = false }
# Pin the policy/provider API so resolution cannot change its contract.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
# Pin verifier identifiers used by the shared CSR tests.
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std"] }

[[test]]
name = "conformance"
required-features = ["test-support"]

[[test]]
name = "openssl_interop"
required-features = ["test-support"]

# rustls/rcgen#459 (branch jgreeer/rcgen:add-public-key-algorithm), pinned to its head commit.
# Remove when rcgen 0.15.0 is published.
[patch.crates-io]
rcgen = { git = "https://github.com/jgreeer/rcgen", rev = "7b1cd91d96a3efc7326ecba868041fd7afe33d62" }
