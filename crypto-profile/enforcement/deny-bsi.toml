# cargo-deny bans for the `bsi` profile, generated by
# `crypto_profile::enforcement::deny_toml`. Regenerate it on every crypto-profile upgrade.
# Check with: cargo deny --config deny-bsi.toml check bans -A unused-wrapper

[graph]
all-features = true
exclude-dev = true

[bans]
multiple-versions = "allow"
deny = [
  # Cryptographic libraries beside the AWS-LC FIPS module.
  { crate = "ring", reason = "ring, beside the AWS-LC FIPS module" },
  { crate = "openssl", reason = "OpenSSL, beside the AWS-LC FIPS module" },
  { crate = "openssl-sys", reason = "OpenSSL, beside the AWS-LC FIPS module" },
  { crate = "native-tls", reason = "the platform's TLS library, beside the AWS-LC FIPS module" },
  { crate = "boring", reason = "BoringSSL, beside the AWS-LC FIPS module" },
  { crate = "boring-sys", reason = "BoringSSL, beside the AWS-LC FIPS module" },
  { crate = "botan", reason = "Botan, beside the AWS-LC FIPS module" },
  { crate = "botan-sys", reason = "Botan, beside the AWS-LC FIPS module" },
  { crate = "mbedtls", reason = "Mbed TLS, beside the AWS-LC FIPS module" },
  { crate = "mbedtls-sys-auto", reason = "Mbed TLS, beside the AWS-LC FIPS module" },
  { crate = "wolfssl", reason = "wolfSSL, beside the AWS-LC FIPS module" },
  { crate = "wolfssl-sys", reason = "wolfSSL, beside the AWS-LC FIPS module" },
  { crate = "libsodium-sys", reason = "libsodium, beside the AWS-LC FIPS module" },
  { crate = "libsodium-sys-stable", reason = "libsodium, beside the AWS-LC FIPS module" },
  { crate = "sodiumoxide", reason = "libsodium, beside the AWS-LC FIPS module" },
  { crate = "graviola", reason = "graviola, beside the AWS-LC FIPS module" },
  { crate = "rustls-rustcrypto", reason = "a RustCrypto provider for rustls, beside the AWS-LC FIPS module" },
  { crate = "rustls-openssl", reason = "an OpenSSL provider for rustls, beside the AWS-LC FIPS module" },
  # The FIPS module and rcgen, only through a crypto-profile backend.
  { crate = "aws-lc-rs", wrappers = ["crypto-profile-awslc4", "crypto-profile-awslc3", "rcgen"], reason = "the AWS-LC FIPS module's own API; reach it through a crypto-profile backend" },
  { crate = "aws-lc-fips-sys", wrappers = ["aws-lc-rs"], reason = "the AWS-LC FIPS module; reach it through a crypto-profile backend" },
  { crate = "aws-lc-sys", wrappers = ["aws-lc-rs"], reason = "AWS-LC outside its FIPS module; reach it through a crypto-profile backend" },
  { crate = "rcgen", wrappers = ["crypto-profile-awslc4", "crypto-profile-awslc3"], reason = "certificate generation with its own signers; use the backend's csr module" },
  # One version of each stack crate.
  { crate = "rustls", deny-multiple-versions = true, reason = "a second rustls, whose default provider the profile does not set" },
  { crate = "rustls-webpki", deny-multiple-versions = true, reason = "a second rustls-webpki, outside the profile's verifiers" },
  # Algorithms `bsi` does not admit.
  { crate = "x25519-dalek", reason = "X25519, which bsi does not admit" },
  { crate = "ed25519-dalek", reason = "Ed25519, which bsi does not admit" },
  { crate = "ed25519", reason = "Ed25519, which bsi does not admit" },
  { crate = "curve25519-dalek", reason = "Curve25519, for X25519 and Ed25519, which bsi does not admit" },
  { crate = "chacha20poly1305", reason = "ChaCha20-Poly1305, which bsi does not admit" },
  { crate = "chacha20", reason = "ChaCha20, which bsi does not admit" },
  { crate = "poly1305", reason = "Poly1305, which bsi does not admit" },
  { crate = "ml-kem", reason = "ML-KEM, which bsi does not admit" },
  { crate = "ml-dsa", reason = "ML-DSA, which bsi does not admit" },
  # Algorithms no profile admits.
  { crate = "md-5", reason = "MD5, which no profile admits" },
  { crate = "md5", reason = "MD5, which no profile admits" },
  { crate = "md4", reason = "MD4, which no profile admits" },
  { crate = "md2", reason = "MD2, which no profile admits" },
  { crate = "sha1", reason = "SHA-1, which no profile admits" },
  { crate = "sha-1", reason = "SHA-1, which no profile admits" },
  { crate = "sha1_smol", reason = "SHA-1, which no profile admits" },
  { crate = "ripemd", reason = "RIPEMD, which no profile admits" },
  { crate = "des", reason = "DES and Triple DES, which no profile admits" },
  { crate = "rc2", reason = "RC2, which no profile admits" },
  { crate = "rc4", reason = "RC4, which no profile admits" },
  { crate = "blowfish", reason = "Blowfish, which no profile admits" },
  { crate = "cast5", reason = "CAST5, which no profile admits" },
  { crate = "idea", reason = "IDEA, which no profile admits" },
  { crate = "tiger", reason = "Tiger, which no profile admits" },
  { crate = "whirlpool", reason = "Whirlpool, which no profile admits" },
  { crate = "sm3", reason = "SM3, which no profile admits" },
  { crate = "sm4", reason = "SM4, which no profile admits" },
  { crate = "streebog", reason = "Streebog, which no profile admits" },
  { crate = "dsa", reason = "DSA, which no profile admits" },
]

# rustls's own providers: use the crypto-profile backend's.
[[bans.features]]
crate = "rustls"
deny = ["aws_lc_rs", "aws-lc-rs", "fips", "ring"]

# rustls-webpki's own providers: use the crypto-profile backend's.
[[bans.features]]
crate = "rustls-webpki"
deny = ["aws-lc-rs", "aws-lc-rs-fips", "aws-lc-rs-unstable", "ring"]
